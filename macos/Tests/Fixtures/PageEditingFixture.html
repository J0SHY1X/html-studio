<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HTML Studio 0.3 QA</title>
  <style>
    body { margin: 0; padding: 30px; background: #eef2f7; font: 18px/1.7 -apple-system, "PingFang SC", sans-serif; }
    .slide { max-width: 760px; min-height: 420px; margin: 0 auto 28px; padding: 34px; background: white; border-radius: 12px; }
    .slide-no { color: #ef7d00; font-weight: 700; }
  </style>
</head>
<body>
  <article class="slide" id="slide-1" data-slide="1">
    <div class="slide-no">第1页</div>
    <h2>剪切稳定性测试</h2>
    <p>请剪切这一句话的一部分，然后继续输入，编辑器应当保持响应。</p>
  </article>
  <article class="slide" id="slide-2" data-slide="2">
    <div class="slide-no">第2页</div>
    <h2>页面复制测试</h2>
    <p>复制第一页后，应当生成新的第二页并自动顺延页码。</p>
  </article>
</body>
</html>
